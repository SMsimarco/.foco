<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>foco. · Auditoría visual</title><style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}body{margin:0;background:#111115;color:#f5f5f7}header{padding:24px clamp(16px,4vw,48px);border-bottom:1px solid #31313b}h1{font-size:28px;margin:0 0 8px}p{color:#bcbcc6;max-width:72ch;line-height:1.5}main{padding:24px clamp(16px,4vw,48px)}.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}label{display:grid;gap:4px;color:#bcbcc6;font-size:13px}select{font:inherit;border:1px solid #555565;border-radius:9px;background:#202027;color:white;padding:9px 12px;min-width:140px}section{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}figure{margin:0;background:#202027;border:1px solid #393942;border-radius:14px;padding:12px}figcaption{font-weight:600;margin-bottom:10px}img{display:block;width:100%;height:min(70vh,720px);object-fit:contain;object-position:top center;background:#33333b;border-radius:9px}a{color:#b7b8ff}nav{margin-top:20px;color:#bcbcc6}@media(max-width:740px){section{grid-template-columns:1fr}img{height:auto;max-height:78vh}}
</style></head><body><header><h1>foco. · Antes / después</h1><p>Auditoría local con datos ficticios en memoria. Compará las vistas en claro y oscuro, a 390 y 1280 px. Las imágenes corresponden al mismo estado de ejemplo.</p></header><main><div class="controls"><label>Vista<select id="view"><option value="hoy">Hoy</option><option value="semana">Semana</option><option value="mes">Mes</option><option value="proyectos">Proyectos</option><option value="detalle">Detalle de proyecto</option><option value="sugerencias">Sugerencias</option><option value="progreso">Progreso</option><option value="empty">Proyectos vacío</option><option value="onboarding">Onboarding móvil</option><option value="loading">Insight: carga</option><option value="error">Insight: error</option></select></label><label>Ancho<select id="width"><option value="390">390 px</option><option value="1280">1280 px</option></select></label><label>Tema<select id="theme"><option value="light">Claro</option><option value="dark">Oscuro</option></select></label></div><section><figure><figcaption>Antes</figcaption><a id="before-link"><img id="before" alt="Captura antes del rediseño"></a></figure><figure><figcaption>Después</figcaption><a id="after-link"><img id="after" alt="Captura después del rediseño"></a></figure></section><nav><a href="INFORME.md">Leer informe de cambios y verificación</a></nav></main><script>
const $=id=>document.getElementById(id);function update(){const v=$('view').value,w=$('width').value,t=$('theme').value;let a,b;if(v==='empty'){a=`empty-${w}-${t}-proyectos.png`;b=`after-empty-${w}-${t}-proyectos.png`}else if(v==='onboarding'){a=`before-390-${t}-onboarding.png`;b=`after-first-open-390-${t}.png`}else if(v==='loading'||v==='error'){a=`before-390-${t}-sugerencias.png`;b=`after-${v}-390-${t}.png`}else{a=`before-${w}-${t}-${v}.png`;b=`after-${w}-${t}-${v}.png`}if(['onboarding','loading','error'].includes(v)){$('width').value='390';$('width').disabled=true}else $('width').disabled=false;for(const [side,file] of [['before',a],['after',b]]){$(side).src=file;$(side+'-link').href=file}}for(const id of ['view','width','theme'])$(id).addEventListener('change',update);update();
</script></body></html>
